workflows:
  dentapro-flutter:
    name: Dentapro Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter pub get
           - name: Build Android APK
        script: |
          cd mobile
          flutter build apk --debug
    artifacts:
      - mobile/build/**/outputs/**/*.apk
