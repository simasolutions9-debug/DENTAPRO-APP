kind = "mobile"
previewPath = "/"
title = "Dental Pro"
description = "A mobile platform for dental practices, professionals, and patients, beginning with secure multi-tenant clinic management and verified professional workspaces."
version = "1.0.0"
id = "artifacts/dental-pro"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23651

[services.development]
run = "pnpm --filter @workspace/dental-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dental-pro", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dental-pro", "run", "serve" ]

[services.env]
PORT = "23651"
BASE_PATH = "/"
